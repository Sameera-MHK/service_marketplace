<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- Favicon -->
    <link rel="icon"           type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png"     href="/favicon.svg" />
    <link rel="apple-touch-icon"                    href="/favicon.svg" />

    <!-- Script / handwriting font for the animated hero word -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />

    <!--
      Static fallback SEO. Every route overrides these at runtime through
      <SEO /> (react-helmet-async), which reads client/src/config/site.js.
      Update the values below to match your own deployment before going live.
    -->
    <title>SkillHub — Workers, Businesses &amp; Services Near You</title>
    <meta name="description" content="Find and hire verified local workers and businesses — electricians, plumbers, salons, caterers, tutors and 49+ categories." />
    <meta name="author"       content="SkillHub" />
    <meta name="theme-color"  content="#7c3aed" />
    <link rel="canonical"     href="https://skillhub.example.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name"    content="SkillHub" />
    <meta property="og:title"        content="SkillHub — Workers, Businesses &amp; Services Near You" />
    <meta property="og:description"  content="Find and hire verified local workers and businesses — electricians, plumbers, salons, caterers, tutors and 49+ categories." />
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://skillhub.example.com/" />
    <meta property="og:image"        content="https://skillhub.example.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"       content="en" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@skillhub" />
    <meta name="twitter:title"       content="SkillHub — Workers, Businesses &amp; Services Near You" />
    <meta name="twitter:description" content="Find and hire verified local workers and businesses near you." />
    <meta name="twitter:image"       content="https://skillhub.example.com/og-image.jpg" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SkillHub",
      "url": "https://skillhub.example.com",
      "logo": "https://skillhub.example.com/favicon.svg",
      "description": "A service marketplace connecting clients with verified local workers and businesses.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@skillhub.example.com",
        "contactType": "customer service"
      }
    }
    </script>

    <!-- JSON-LD: WebSite (enables the Google Sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SkillHub",
      "url": "https://skillhub.example.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://skillhub.example.com/browse?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!--
      Analytics: paste your own snippet here (Google Analytics, Plausible,
      Umami, …). Intentionally left out so a fresh clone sends no telemetry.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
